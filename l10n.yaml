arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n
nullable-getter: false
# Every message in the template must carry an `@key` entry: a translated ARB is
# generated key-by-key, and an attribute is where the translator gets context.
required-resource-attributes: true
use-deferred-loading: false
